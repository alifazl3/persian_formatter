services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: persian_formatter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d persian_formatter"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      PORT: "80"
      PUBLIC_DIR: /app/public
      DATABASE_URL: postgres://postgres:mysecretpassword@postgres:5432/persian_formatter
      MAX_CONTENT_LENGTH: "200000"
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
