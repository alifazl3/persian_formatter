<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pretty Text Viewer</title>

  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --panel-soft: #1f2330;
      --text: #e6e8ee;
      --muted: #9ca3af;
      --border: #2d3342;
      --accent: #7c9cff;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --code: #10131a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(124, 156, 255, 0.12), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.8;
      padding: 32px;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      font-size: 15px;
      line-height: 1.8;
      outline: none;
      direction: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(124, 156, 255, 0.12);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
      color: white;
      background: var(--accent);
    }

    button.secondary {
      background: var(--panel-soft);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .preview {
      background: rgba(23, 26, 35, 0.8);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      overflow: hidden;
    }

    .block {
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }

    .block:last-child {
      border-bottom: 0;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .paragraph {
      color: var(--text);
      white-space: pre-wrap;
    }

    .list {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    .list li {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }

    .code {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      overflow-x: auto;
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      color: #d7e0ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.7;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      margin-inline-start: 8px;
    }

    .ok {
      color: var(--success);
    }

    .warn {
      color: var(--warning);
    }

    .bad {
      color: var(--danger);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 60px 20px;
    }

    @media (max-width: 700px) {
      body {
        padding: 18px;
      }

      .preview {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <h1>Pretty Text Viewer</h1>
        <div class="hint">متن خام را Paste کن؛ پایین تمیز، بخش‌بندی‌شده و خوانا نمایش داده می‌شود.</div>
      </div>

      <div class="toolbar">
        <button onclick="pasteInput()">Paste</button>
        <button class="secondary" onclick="copyOutput()">کپی خروجی</button>
        <button class="secondary" onclick="clearAll()">پاک کردن</button>
      </div>
    </header>

    <textarea id="input" placeholder="متن به‌هم‌ریخته را اینجا Paste کن..."></textarea>

    <section id="preview" class="preview">
      <div class="empty">هنوز متنی وارد نشده است.</div>
    </section>
  </main>

  <script>
    const input = document.getElementById("input");
    const preview = document.getElementById("preview");

    input.addEventListener("input", render);

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function isCodeLike(text) {
      return (
        text.includes("┌") ||
        text.includes("├") ||
        text.includes("└") ||
        text.includes("│") ||
        text.includes("```") ||
        /^[\s]*[-✔◼✅⏺※✻]/m.test(text)
      );
    }

    function isTitle(line) {
      const clean = line.trim();

      if (!clean) return false;
      if (clean.length > 90) return false;

      return (
        clean.endsWith(":") ||
        clean.endsWith("؟") ||
        clean.startsWith("چی ") ||
        clean.startsWith("الان ") ||
        clean.startsWith("نکته") ||
        clean.startsWith("قدم") ||
        clean.startsWith("نتیجه") ||
        clean.startsWith("v") ||
        /^[۰-۹0-9]+\./.test(clean)
      );
    }

    function decorate(text) {
      return escapeHtml(text)
        .replaceAll("✅", '<span class="ok">✅</span>')
        .replaceAll("✔", '<span class="ok">✔</span>')
        .replaceAll("⏳", '<span class="warn">⏳</span>')
        .replaceAll("⚠️", '<span class="warn">⚠️</span>')
        .replaceAll("❌", '<span class="bad">❌</span>');
    }

    function splitBlocks(text) {
      return text
        .replace(/\r/g, "")
        .split(/\n{2,}/)
        .map(block => block.trim())
        .filter(Boolean);
    }

    function render() {
      const raw = input.value.trim();

      if (!raw) {
        preview.innerHTML = '<div class="empty">هنوز متنی وارد نشده است.</div>';
        return;
      }

      const blocks = splitBlocks(raw);

      preview.innerHTML = blocks.map(block => {
        const lines = block.split("\n").map(l => l.trimEnd());
        const first = lines[0].trim();

        if (isCodeLike(block)) {
          return `
            <div class="block">
              <div class="code">${decorate(block)}</div>
            </div>
          `;
        }

        if (isTitle(first) && lines.length > 1) {
          return `
            <div class="block">
              <div class="title">${decorate(first.replace(/:$/, ""))}</div>
              <div class="paragraph">${decorate(lines.slice(1).join("\n"))}</div>
            </div>
          `;
        }

        if (lines.every(line => /^[-•*]\s+/.test(line.trim()))) {
          return `
            <div class="block">
              <ul class="list">
                ${lines.map(line => `<li>${decorate(line.replace(/^[-•*]\s+/, ""))}</li>`).join("")}
              </ul>
            </div>
          `;
        }

        return `
          <div class="block">
            <div class="paragraph">${decorate(block)}</div>
          </div>
        `;
      }).join("");
    }

    async function pasteInput() {
      try {
        const text = await navigator.clipboard.readText();
        input.value = text;
        render();
        input.focus();
      } catch (err) {
        input.focus();
      }
    }

    async function copyOutput() {
      const text = preview.innerText.trim();
      if (!text) return;
      await navigator.clipboard.writeText(text);
    }

    function clearAll() {
      input.value = "";
      render();
    }
  </script>
</body>
</html>
