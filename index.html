<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pretty Text Viewer</title>

  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --panel-soft: #1f2330;
      --text: #e6e8ee;
      --muted: #9ca3af;
      --border: #2d3342;
      --accent: #7c9cff;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --code: #10131a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(124, 156, 255, 0.12), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.8;
      padding: 32px;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      font-size: 15px;
      line-height: 1.8;
      outline: none;
      direction: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(124, 156, 255, 0.12);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
      color: white;
      transition: filter 0.18s, transform 0.05s, box-shadow 0.18s;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(1px);
    }

    button svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    button.paste {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.32);
    }

    button.copy {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.28);
    }

    button.clear {
      background: var(--panel-soft);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.clear:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .preview {
      background: rgba(23, 26, 35, 0.8);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      overflow: hidden;
    }

    .block {
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }

    .block:last-child {
      border-bottom: 0;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .paragraph {
      color: var(--text);
      white-space: pre-wrap;
    }

    .list {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    .list li {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }

    .code {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      overflow-x: auto;
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      color: #d7e0ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.7;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      margin-inline-start: 8px;
    }

    .ok {
      color: var(--success);
    }

    .warn {
      color: var(--warning);
    }

    .bad {
      color: var(--danger);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 60px 20px;
    }

    .footer {
      display: flex;
      justify-content: center;
      padding: 8px 0 4px;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel-soft);
      transition: color 0.2s, border-color 0.2s;
      direction: ltr;
    }

    .repo-link:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    @media (max-width: 700px) {
      body {
        padding: 18px;
      }

      .preview {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <h1>Pretty Text Viewer</h1>
        <div class="hint">متن خام را Paste کن؛ پایین تمیز، بخش‌بندی‌شده و خوانا نمایش داده می‌شود.</div>
      </div>

      <div class="toolbar">
        <button class="paste" onclick="pasteInput()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="2" width="8" height="4" rx="1"></rect>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          </svg>
          <span>Paste</span>
        </button>
        <button class="copy" onclick="copyOutput()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>کپی خروجی</span>
        </button>
        <button class="clear" onclick="clearAll()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"></path>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>پاک کردن</span>
        </button>
      </div>
    </header>

    <textarea id="input" placeholder="متن به‌هم‌ریخته را اینجا Paste کن..."></textarea>

    <section id="preview" class="preview">
      <div class="empty">هنوز متنی وارد نشده است.</div>
    </section>

    <footer class="footer">
      <a class="repo-link" href="https://github.com/alifazl3/persian_formatter" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        <span>alifazl3/persian_formatter</span>
      </a>
    </footer>
  </main>

  <script>
    const input = document.getElementById("input");
    const preview = document.getElementById("preview");

    input.addEventListener("input", render);

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function isCodeLike(text) {
      return (
        text.includes("┌") ||
        text.includes("├") ||
        text.includes("└") ||
        text.includes("│") ||
        text.includes("```") ||
        /^[\s]*[-✔◼✅⏺※✻]/m.test(text)
      );
    }

    function isTitle(line) {
      const clean = line.trim();

      if (!clean) return false;
      if (clean.length > 90) return false;

      return (
        clean.endsWith(":") ||
        clean.endsWith("؟") ||
        clean.startsWith("چی ") ||
        clean.startsWith("الان ") ||
        clean.startsWith("نکته") ||
        clean.startsWith("قدم") ||
        clean.startsWith("نتیجه") ||
        clean.startsWith("v") ||
        /^[۰-۹0-9]+\./.test(clean)
      );
    }

    function decorate(text) {
      return escapeHtml(text)
        .replaceAll("✅", '<span class="ok">✅</span>')
        .replaceAll("✔", '<span class="ok">✔</span>')
        .replaceAll("⏳", '<span class="warn">⏳</span>')
        .replaceAll("⚠️", '<span class="warn">⚠️</span>')
        .replaceAll("❌", '<span class="bad">❌</span>');
    }

    function splitBlocks(text) {
      return text
        .replace(/\r/g, "")
        .split(/\n{2,}/)
        .map(block => block.trim())
        .filter(Boolean);
    }

    function render() {
      const raw = input.value.trim();

      if (!raw) {
        preview.innerHTML = '<div class="empty">هنوز متنی وارد نشده است.</div>';
        return;
      }

      const blocks = splitBlocks(raw);

      preview.innerHTML = blocks.map(block => {
        const lines = block.split("\n").map(l => l.trimEnd());
        const first = lines[0].trim();

        if (isCodeLike(block)) {
          return `
            <div class="block">
              <div class="code">${decorate(block)}</div>
            </div>
          `;
        }

        if (isTitle(first) && lines.length > 1) {
          return `
            <div class="block">
              <div class="title">${decorate(first.replace(/:$/, ""))}</div>
              <div class="paragraph">${decorate(lines.slice(1).join("\n"))}</div>
            </div>
          `;
        }

        if (lines.every(line => /^[-•*]\s+/.test(line.trim()))) {
          return `
            <div class="block">
              <ul class="list">
                ${lines.map(line => `<li>${decorate(line.replace(/^[-•*]\s+/, ""))}</li>`).join("")}
              </ul>
            </div>
          `;
        }

        return `
          <div class="block">
            <div class="paragraph">${decorate(block)}</div>
          </div>
        `;
      }).join("");
    }

    async function pasteInput() {
      try {
        const text = await navigator.clipboard.readText();
        input.value = text;
        render();
        input.focus();
      } catch (err) {
        input.focus();
      }
    }

    async function copyOutput() {
      const text = preview.innerText.trim();
      if (!text) return;
      await navigator.clipboard.writeText(text);
    }

    function clearAll() {
      input.value = "";
      render();
    }
  </script>
</body>
</html>
