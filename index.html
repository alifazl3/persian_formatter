<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pretty Text Viewer</title>

  <!-- Syntax highlighting for code blocks (pinned, with graceful degradation). -->
  <link id="hljsTheme" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css" />
  <script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <!-- Math rendering ($$…$$ / $…$ / \(…\)) via KaTeX + auto-render (pinned). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --panel-soft: #1f2330;
      --text: #e6e8ee;
      --muted: #9ca3af;
      --border: #2d3342;
      --accent: #7c9cff;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --code: #10131a;
      --code-text: #d7e0ff;
      --strong: #ffffff;
      --row-alt: rgba(255, 255, 255, 0.02);
      --glow: rgba(124, 156, 255, 0.12);
    }

    :root[data-theme="light"] {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --panel-soft: #eef1f7;
      --text: #1f2430;
      --muted: #5b6472;
      --border: #d9dee8;
      --accent: #4f6ef7;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --code: #f3f4f8;
      --code-text: #1f2430;
      --strong: #0b1020;
      --row-alt: rgba(0, 0, 0, 0.03);
      --glow: rgba(79, 110, 247, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, var(--glow), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.8;
      padding: 32px;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
    }

    /* The header is a layout-only wrapper: its children (text + tools) take part
       directly in the .app grid, so they can sit on top (header mode) or flank
       the content as two sidebars (sidebar mode). */
    header {
      display: contents;
    }

    .head-text {
      grid-area: text;
    }

    .toolbar {
      grid-area: tools;
    }

    .input-shell {
      grid-area: input;
    }

    .preview-shell {
      grid-area: preview;
    }

    .footer {
      grid-area: footer;
    }

    /* Header mode: text + tools on one top row, content full-width below. */
    .app.mode-header {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "text tools"
        "input input"
        "preview preview"
        "footer footer";
      align-items: center;
    }

    .app.mode-header .head-text {
      align-self: center;
    }

    /* Sidebar mode: header removed; text becomes the right sidebar, tools the
       left sidebar, with the input/output stacked in the center. */
    .app.mode-sidebar {
      max-width: 1320px;
      grid-template-columns: 230px minmax(0, 1fr) 230px;
      grid-template-areas:
        "text input tools"
        "text preview tools"
        "footer footer footer";
      align-items: start;
    }

    .app.mode-sidebar .head-text,
    .app.mode-sidebar .toolbar {
      position: sticky;
      top: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .app.mode-sidebar h1 {
      font-size: 20px;
    }

    /* In the narrow right sidebar, put the title on its own full-width line and
       let the toggle buttons wrap onto the row below (instead of squeezing into
       the title and forcing it to wrap mid-word). */
    .app.mode-sidebar .head-title-row {
      flex-wrap: wrap;
      gap: 8px;
    }

    .app.mode-sidebar .head-title-row h1 {
      flex-basis: 100%;
    }

    .app.mode-sidebar .toolbar {
      flex-direction: column;
      align-items: stretch;
    }

    .app.mode-sidebar .toolbar button {
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 820px) {
      /* Narrow screens always stack — sidebars would be too cramped. */
      .app.mode-sidebar {
        max-width: 1100px;
        grid-template-columns: 1fr;
        grid-template-areas:
          "text"
          "tools"
          "input"
          "preview"
          "footer";
      }

      .app.mode-sidebar .head-text,
      .app.mode-sidebar .toolbar {
        position: static;
      }

      .app.mode-sidebar .toolbar {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .app.mode-sidebar .toolbar button {
        width: auto;
      }
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    .head-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Layout toggle: switches between header mode and two-sidebar mode. */
    .layout-toggle {
      padding: 6px 10px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .layout-toggle:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .layout-toggle svg {
      width: 15px;
      height: 15px;
    }

    /* Theme toggle shows the icon for the theme you'd switch TO:
       dark mode → sun (go light); light mode → moon (go dark). */
    .theme-toggle .ic-moon {
      display: none;
    }

    .theme-toggle .ic-sun {
      display: inline;
    }

    :root[data-theme="light"] .theme-toggle .ic-sun {
      display: none;
    }

    :root[data-theme="light"] .theme-toggle .ic-moon {
      display: inline;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      font-size: 15px;
      line-height: 1.8;
      outline: none;
      direction: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--glow);
    }

    /* Input collapses after a paste; an edit button brings it back. */
    .edit-input-btn {
      display: none;
      width: 100%;
      justify-content: center;
      background: var(--panel-soft);
      color: var(--text);
      border: 1px dashed var(--border);
    }

    .edit-input-btn:hover {
      border-color: var(--accent);
    }

    .input-shell.collapsed textarea {
      display: none;
    }

    .input-shell.collapsed .edit-input-btn {
      display: inline-flex;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
      color: white;
      transition: filter 0.18s, transform 0.05s, box-shadow 0.18s;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(1px);
    }

    button svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    button.paste {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.32);
    }

    button.copy-input {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.28);
    }

    button.copy {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.28);
    }

    button.upload {
      background: linear-gradient(135deg, #14b8a6, #0d9488);
      box-shadow: 0 4px 14px rgba(20, 184, 166, 0.28);
    }

    button.share {
      background: linear-gradient(135deg, #f59e0b, #f97316);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.28);
    }

    button.share[disabled] {
      opacity: 0.6;
      cursor: progress;
    }

    button.clear {
      background: var(--panel-soft);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.clear:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Share link toast: appears bottom-center after a successful share. */
    .share-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: min(92vw, 560px);
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .share-toast[hidden] {
      display: none;
    }

    .share-toast-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .share-link {
      flex: 1;
      min-width: 0;
      background: var(--code);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      outline: none;
    }

    .share-copy {
      background: var(--accent);
      color: #fff;
      padding: 8px 14px;
      font-size: 13px;
    }

    .share-close {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 16px;
      line-height: 1;
    }

    .share-close:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .preview-shell {
      position: relative;
    }

    .preview {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    /* Lock toggle for the output — locked by default; unlock to edit. */
    .lock-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .lock-btn svg {
      width: 15px;
      height: 15px;
    }

    .lock-btn .ic-unlock {
      display: none;
    }

    /* Editing state: open lock, accent border, edit affordance. */
    .preview-shell.editing .lock-btn {
      color: var(--success);
      border-color: var(--success);
    }

    .preview-shell.editing .lock-btn .ic-lock {
      display: none;
    }

    .preview-shell.editing .lock-btn .ic-unlock {
      display: inline;
    }

    .preview-shell.editing .preview {
      border-color: var(--success);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
    }

    #preview[contenteditable="true"] {
      outline: none;
      cursor: text;
    }

    /* Blocks are separated by spacing, not dividers — the bold headings, boxed
       code and list cards already carry the visual structure. */
    .block {
      padding: 6px 0;
    }

    .block + .block {
      margin-top: 10px;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
      color: var(--strong);
    }

    .paragraph {
      color: var(--text);
      white-space: pre-wrap;
      /* Base direction (dir attribute) is set per line from the dominant script,
         so a mostly-Persian line that merely starts with an English word still
         reads RTL. text-align follows the direction automatically. */
    }

    .list {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    .list li {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }

    /* Markdown tables */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .md-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }

    .md-table th,
    .md-table td {
      border-bottom: 1px solid var(--border);
      border-inline-start: 1px solid var(--border);
      padding: 9px 14px;
      text-align: right;
      unicode-bidi: plaintext;
    }

    .md-table th:first-child,
    .md-table td:first-child {
      border-inline-start: 0;
    }

    .md-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .md-table thead th {
      background: var(--panel-soft);
      font-weight: 800;
      color: var(--strong);
    }

    .md-table tbody tr:nth-child(even) td {
      background: var(--row-alt);
    }

    /* Inline markdown shared by prose and table cells */
    .inline-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 0.9em;
      direction: ltr;
      unicode-bidi: embed;
    }

    .paragraph strong,
    .md-table strong,
    .list strong {
      color: var(--strong);
    }

    .code {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      overflow-x: auto;
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin: 0;
      color: var(--code-text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.7;
    }

    /* Highlighted code: keep our container, let highlight.js paint the tokens.
       Every code box reserves a top strip for the copy button + language badge. */
    pre.code {
      position: relative;
      padding-top: 44px;
    }

    pre.code code {
      display: block;
      background: transparent;
      padding: 0;
      font: inherit;
      color: inherit;
    }

    /* Per-box copy button, top-left (start of the LTR code box). */
    .code-copy {
      position: absolute;
      top: 8px;
      left: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 700;
      white-space: normal;
      cursor: pointer;
    }

    .code-copy:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .code-copy svg {
      width: 14px;
      height: 14px;
    }

    .code-copy .ic-check {
      display: none;
      color: var(--success);
    }

    .code-copy.copied {
      color: var(--success);
      border-color: var(--success);
    }

    .code-copy.copied .ic-copy {
      display: none;
    }

    .code-copy.copied .ic-check {
      display: inline;
    }

    pre.code .hljs,
    pre.code code.hljs {
      background: transparent;
    }

    /* Detected/declared language badge, pinned to the top-right of the box. */
    pre.code .lang {
      position: absolute;
      top: 10px;
      right: 12px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: var(--panel-soft);
      border: 1px solid var(--border);
      padding: 2px 10px;
      border-radius: 999px;
      user-select: none;
      pointer-events: none;
    }

    pre.code .lang:empty {
      display: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      margin-inline-start: 8px;
    }

    .ok {
      color: var(--success);
    }

    .warn {
      color: var(--warning);
    }

    .bad {
      color: var(--danger);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 60px 20px;
    }

    .footer {
      display: flex;
      justify-content: center;
      padding: 8px 0 4px;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel-soft);
      transition: color 0.2s, border-color 0.2s;
      direction: ltr;
    }

    .repo-link:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    @media (max-width: 700px) {
      body {
        padding: 18px;
      }

      .preview {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header id="appHeader">
      <div class="head-text">
        <div class="head-title-row">
          <h1>Pretty Text Viewer</h1>
          <button class="layout-toggle" type="button" onclick="toggleLayout()" title="تغییر چیدمان (هدر / ساید‌بار)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <line x1="15" y1="3" x2="15" y2="21"></line>
            </svg>
            <span class="layout-label">ساید‌بار</span>
          </button>
          <button class="layout-toggle theme-toggle" type="button" onclick="toggleTheme()" title="تغییر تم (روشن / تیره)">
            <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <span class="theme-label">روشن</span>
          </button>
        </div>
        <div class="hint">متن خام را Paste کن؛ پایین تمیز، بخش‌بندی‌شده و خوانا نمایش داده می‌شود.</div>
      </div>

      <div class="toolbar">
        <button class="paste" onclick="pasteInput()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="2" width="8" height="4" rx="1"></rect>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          </svg>
          <span>Paste</span>
        </button>
        <button class="upload" type="button" onclick="document.getElementById('fileInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>بارگذاری فایل</span>
        </button>
        <input type="file" id="fileInput" hidden onchange="handleFileUpload(event)" />
        <button class="share" id="shareBtn" onclick="shareCurrent()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span>اشتراک‌گذاری</span>
        </button>
        <button class="copy-input" onclick="copyInput()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>کپی ورودی</span>
        </button>
        <button class="copy" onclick="copyOutput()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>

        <button class="clear" onclick="clearAll()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <div class="input-shell" id="inputShell">

        <div class="empty">هنوز متنی وارد نشده است.</div>

    <footer class="footer">

        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">

  </main>

  <div id="shareToast" class="share-toast" hidden>
    <span class="share-toast-label">لینک اشتراک</span>
    <input id="shareLink" class="share-link" type="text" readonly dir="ltr" />
    <button class="share-copy" type="button" onclick="copyShareLink()">کپی</button>
    <button class="share-close" type="button" onclick="hideShareToast()" title="بستن" aria-label="بستن">×</button>
  </div>

  <script>
    const input = document.getElementById("input");
    const preview = document.getElementById("preview");

    input.addEventListener("input", render);

    // Nothing is persisted; instead, warn before an accidental refresh/close so
    // the text isn't lost without confirmation.
    window.addEventListener("beforeunload", (event) => {
      if (input.value.trim()) {
        event.preventDefault();
        event.returnValue = "";
      }
    });

    // While the user has explicitly opened the editor to edit, a paste must NOT
    // auto-collapse it; otherwise every paste collapses the input.
    let editingInput = false;

    // Pasting with Ctrl/Cmd+V collapses the editor too (not just the button).
    // Defer one tick so the pasted text is in place before we collapse.
    input.addEventListener("paste", () => {
      setTimeout(() => {
        if (!editingInput && input.value.trim()) collapseInput();
      }, 0);
    });

    // On load, try to read the clipboard and pre-fill the input. We keep the
    // editor open so the user can review/edit, and only collapse once they
    // press Enter to confirm. Browsers gate clipboard reads behind a user
    // gesture, so this often no-ops on a bare load — that's intentional.
    let pendingAutoPaste = false;
    async function autoPasteFromClipboard() {
      if (input.value.trim()) return; // don't clobber existing text
      try {
        const text = await navigator.clipboard.readText();
        if (!text.trim()) return;
        input.value = text;
        render();
        expandInput();        // keep open & focused for review
        pendingAutoPaste = true;
      } catch (err) {
        /* clipboard unavailable or permission denied — ignore */
      }
    }

    // After an auto-paste, the first Enter confirms and collapses the input
    // (instead of inserting a newline). Scoped to pendingAutoPaste so normal
    // editing keeps its newline behaviour.
    input.addEventListener("keydown", (e) => {
      if (pendingAutoPaste && e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        pendingAutoPaste = false;
        collapseInput();
      }
    });

    // highlight.js is deferred; once it (and the page) is ready, repaint any
    // code that was already rendered.
    window.addEventListener("load", () => {
      if (input.value.trim()) render();
      autoPasteFromClipboard();
    });

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    // Copy button markup for code boxes (copy icon + a check shown after copy).
    const CODE_COPY_BTN =
      '<button class="code-copy" type="button" onclick="copyCode(this)" title="کپی کد">' +
        '<svg class="ic-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>' +
        '<svg class="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
        '<span class="copy-text">کپی</span>' +
      '</button>';

    // Texty fence tags (or a bare ``` fence) carry no real language, so the
    // content decides whether it is actual code or just Persian prose.
    const TEXTY_FENCES = ["", "text", "txt", "plain", "plaintext", "md", "markdown"];

    function fenceLang(block) {
      const match = (block.split("\n")[0] || "").match(/^\s*```([A-Za-z0-9_+#-]*)/);
      return match ? match[1].toLowerCase() : null;
    }

    function persianRatio(text) {
      const letters = text.match(/[A-Za-z؀-ۿ]/g) || [];
      if (!letters.length) return 0;
      const persian = text.match(/[؀-ۿ]/g) || [];
      return persian.length / letters.length;
    }

    // Base direction from the dominant script, not the first character. A line
    // with any meaningful Persian content reads RTL even if it opens with an
    // English word (e.g. "dump را داخل ..."); pure command/English lines read LTR.
    function dirAttr(text) {
      return persianRatio(text) >= 0.3 ? ' dir="rtl"' : ' dir="ltr"';
    }

    function isBoxDrawing(text) {
      return /[─-╿]/.test(text);
    }

    // Decide whether a block is real code (LTR monospace) or prose. A fenced
    // block with a real language tag (```js) is always code; box-drawing art is
    // always code; otherwise we only treat it as code when it is barely Persian.
    function isCodeBlock(content, lang) {
      const isFenced = lang !== null;
      const realLang = isFenced && lang && !TEXTY_FENCES.includes(lang);

      if (isBoxDrawing(content)) return true;
      if (realLang) return true;
      if (isFenced && persianRatio(content) < 0.2) return true;
      return false;
    }

    // Drop every standalone fence line (```、```js、```text …) wherever it sits.
    // splitBlocks may separate an opening and closing fence into different
    // blocks when the fenced content has blank lines, so position-based removal
    // is not enough — strip any line that is purely a fence.
    function stripFence(block) {
      return block
        .split("\n")
        .filter(line => !/^\s*```[A-Za-z0-9_+#-]*\s*$/.test(line))
        .join("\n")
        .replace(/^\n+|\n+$/g, "");
    }

    function isTitle(line) {
      const clean = line.trim();

      if (!clean) return false;
      if (clean.length > 90) return false;

      return (
        clean.endsWith(":") ||
        clean.endsWith("؟") ||
        clean.startsWith("چی ") ||
        clean.startsWith("الان ") ||
        clean.startsWith("نکته") ||
        clean.startsWith("قدم") ||
        clean.startsWith("نتیجه") ||
        clean.startsWith("v") ||
        /^[۰-۹0-9]+\./.test(clean)
      );
    }

    function decorate(text) {
      return escapeHtml(text)
        .replaceAll("✅", '<span class="ok">✅</span>')
        .replaceAll("✔", '<span class="ok">✔</span>')
        .replaceAll("⏳", '<span class="warn">⏳</span>')
        .replaceAll("⚠️", '<span class="warn">⚠️</span>')
        .replaceAll("❌", '<span class="bad">❌</span>');
    }

    // decorate + lightweight inline markdown (**bold**, `code`). Asterisks and
    // backticks survive escapeHtml, so this stays safe.
    function inlineMd(text) {
      return decorate(text)
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        // Real inline code here is always Latin/identifier text. A "span" made
        // of mis-paired backticks often swallows Persian prose (or wraps a lone
        // "/"): if the content has Persian letters or no alphanumerics at all,
        // it isn't code — drop the backticks and keep the text literal.
        .replace(/`([^`]+)`/g, (m, code) =>
          !/[؀-ۿ]/.test(code) && /[A-Za-z0-9]/.test(code)
            ? `<code class="inline-code">${code}</code>`
            : code
        );
    }

    function splitRow(line) {
      let s = line.trim();
      if (s.startsWith("|")) s = s.slice(1);
      if (s.endsWith("|")) s = s.slice(0, -1);
      return s.split("|").map(cell => cell.trim());
    }

    // A markdown table = a header row followed by a separator row made only of
    // -, :, | and spaces (e.g. |----|:--:|).
    function isTable(lines) {
      if (lines.length < 2) return false;
      const sep = lines[1].trim();
      return (
        lines[0].includes("|") &&
        sep.includes("|") &&
        sep.includes("-") &&
        /^\|?[\s:|-]+\|?$/.test(sep)
      );
    }

    function renderTable(lines) {
      const aligns = splitRow(lines[1]).map(c => {
        const left = c.startsWith(":");
        const right = c.endsWith(":");
        return left && right ? "center" : right ? "right" : left ? "left" : "";
      });
      const head = splitRow(lines[0]);
      const cols = head.length;
      const alignAttr = i => (aligns[i] ? ` style="text-align:${aligns[i]}"` : "");
      const pad = row => {
        const cells = row.slice(0, cols);
        while (cells.length < cols) cells.push("");
        return cells;
      };

      const thead = `<tr>${pad(head).map((c, i) => `<th${alignAttr(i)}>${inlineMd(c)}</th>`).join("")}</tr>`;
      const body = lines
        .slice(2)
        .filter(line => line.includes("|"))
        .map(line => `<tr>${pad(splitRow(line)).map((c, i) => `<td${alignAttr(i)}>${inlineMd(c)}</td>`).join("")}</tr>`)
        .join("");

      return `
        <div class="block">
          <div class="table-wrap">
            <table class="md-table">
              <thead>${thead}</thead>
              <tbody>${body}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Render prose lines, grouping consecutive bullet lines into a <ul> and
    // emitting every other line as its own paragraph. LLM logs put one logical
    // step per line with single newlines (no blank line between them), but
    // splitBlocks only breaks on blank lines — so without per-line paragraphs
    // here the whole text merges into one run-on paragraph. Also handles the
    // common intro-line-then-bullets pattern.
    function isBulletLine(line) {
      return /^[-•*]\s+/.test(line.trim());
    }

    function renderProseLines(lines) {
      let html = "";
      let i = 0;
      while (i < lines.length) {
        if (isBulletLine(lines[i])) {
          const items = [];
          while (i < lines.length && isBulletLine(lines[i])) {
            items.push(lines[i].trim().replace(/^[-•*]\s+/, ""));
            i++;
          }
          html += `<ul class="list">${items.map(it => `<li${dirAttr(it)}>${inlineMd(it)}</li>`).join("")}</ul>`;
        } else {
          const line = lines[i].trim();
          if (line) html += `<div class="paragraph"${dirAttr(line)}>${inlineMd(line)}</div>`;
          i++;
        }
      }
      return html;
    }

    function splitBlocks(text) {
      return text
        .replace(/\r/g, "")
        .split(/\n{2,}/)
        .map(block => block.trim())
        .filter(Boolean);
    }

    // Drop Arabic diacritics (kasra, fatha, …) that sit on a NON-Arabic base —
    // e.g. a stray "defaultِ" pasted from a terminal renders as a tofu box.
    // Marks on real Arabic/Persian letters (e.g. "دامنهٔ") are kept.
    const HARAKAT = /[ً-ٰٟ]/;
    const ARABIC_BASE = /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/;

    function stripOrphanHarakat(text) {
      let out = "";
      let lastBase = "";
      for (const ch of text) {
        if (HARAKAT.test(ch)) {
          if (ARABIC_BASE.test(lastBase)) out += ch;
        } else {
          out += ch;
          lastBase = ch;
        }
      }
      return out;
    }

    function render() {
      const raw = stripOrphanHarakat(input.value).trim();

      if (!raw) {
        preview.innerHTML = '<div class="empty">هنوز متنی وارد نشده است.</div>';
        return;
      }

      const blocks = splitBlocks(raw);

      preview.innerHTML = blocks.map(block => {
        const lang = fenceLang(block);
        const content = stripFence(block);

        if (isCodeBlock(content, lang)) {
          // Box-drawing art is not a language — mark it plain so the highlighter
          // skips it (it would mangle the ASCII table). Still gets a copy button.
          if (isBoxDrawing(content)) {
            return `
              <div class="block">
                <pre class="code plain">${CODE_COPY_BTN}<code>${decorate(content)}</code></pre>
              </div>
            `;
          }

          // Real code: a known fence language is honored, otherwise the
          // highlighter auto-detects. Escape here; highlightCode re-reads
          // textContent and repaints, so there is no double-escaping.
          const realLang = lang && !TEXTY_FENCES.includes(lang);
          const dataLang = realLang ? ` data-lang="${lang}"` : "";
          return `
            <div class="block">
              <pre class="code"${dataLang}><span class="lang"></span>${CODE_COPY_BTN}<code>${escapeHtml(content)}</code></pre>
            </div>
          `;
        }

        // Prose family (Persian-first): tables, titles, lists, paragraphs — all
        // rendered RTL. Work on the fence-stripped content so ```text vanishes.
        const lines = content.split("\n").map(l => l.trimEnd());
        const first = lines[0].trim();

        if (isTable(lines)) {
          return renderTable(lines);
        }

        if (isTitle(first) && lines.length > 1) {
          return `
            <div class="block">
              <div class="title"${dirAttr(first)}>${inlineMd(first.replace(/:$/, ""))}</div>
              ${renderProseLines(lines.slice(1))}
            </div>
          `;
        }

        return `
          <div class="block">
            ${renderProseLines(lines)}
          </div>
        `;
      }).join("");

      highlightCode();
      renderMath();
    }

    function renderMath() {
      if (!window.renderMathInElement) return;
      try {
        renderMathInElement(preview, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false,
          strict: false
        });
      } catch (err) {
        /* leave the formula as plain text on failure */
      }
    }

    function highlightCode() {
      if (!window.hljs) return;
      preview.querySelectorAll("pre.code:not(.plain)").forEach(pre => {
        const code = pre.querySelector("code");
        const label = pre.querySelector(".lang");
        if (!code) return;

        // textContent gives back the raw (browser-decoded) source, so passing
        // it straight to highlight.js avoids any double-escaping.
        const raw = code.textContent;
        const declared = pre.dataset.lang;

        try {
          const result = (declared && hljs.getLanguage(declared))
            ? hljs.highlight(raw, { language: declared, ignoreIllegals: true })
            : hljs.highlightAuto(raw);

          code.innerHTML = result.value;
          code.classList.add("hljs");

          const name = result.language || declared || "";
          if (label) label.textContent = name;
          pre.classList.toggle("has-lang", Boolean(name));
        } catch (err) {
          /* leave the block as plain escaped code on failure */
        }
      });
    }

    async function pasteInput() {
      try {
        const text = await navigator.clipboard.readText();
        input.value = text;
        render();
        // Explicit fresh paste via the button → always collapse (ends editing).
        if (text.trim()) collapseInput();
      } catch (err) {
        input.focus();
      }
    }

    // Read an uploaded file entirely in the browser and drop its text into the
    // editor. The file is NEVER uploaded to the server — only its text is read.
    function handleFileUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        input.value = typeof reader.result === "string" ? reader.result : "";
        render();
        if (input.value.trim()) collapseInput();
      };
      reader.readAsText(file);

      // Reset so selecting the same file again still fires onchange.
      event.target.value = "";
    }

    function collapseInput() {
      document.getElementById("inputShell").classList.add("collapsed");
      editingInput = false;
    }

    function expandInput() {
      document.getElementById("inputShell").classList.remove("collapsed");
      editingInput = true; // opened to edit — keep open through pastes
      input.focus();
    }

    async function copyInput() {
      const text = input.value.trim();
      if (!text) return;
      await navigator.clipboard.writeText(text);
    }

    // The output text without the UI chrome (per-box copy buttons, lang badges).
    function outputText() {
      const clone = preview.cloneNode(true);
      clone.querySelectorAll(".code-copy, .lang").forEach(el => el.remove());
      clone.removeAttribute("id");
      clone.style.position = "absolute";
      clone.style.left = "-99999px";
      document.body.appendChild(clone);
      const text = clone.innerText.trim();
      document.body.removeChild(clone);
      return text;
    }

    async function copyOutput() {
      const text = outputText();
      if (!text) return;
      await navigator.clipboard.writeText(text);
    }

    async function copyCode(btn) {
      const pre = btn.closest("pre.code");
      const code = pre && pre.querySelector("code");
      if (!code) return;

      try {
        await navigator.clipboard.writeText(code.innerText);
        const label = btn.querySelector(".copy-text");
        const prev = label ? label.textContent : "";
        btn.classList.add("copied");
        if (label) label.textContent = "کپی شد";
        setTimeout(() => {
          btn.classList.remove("copied");
          if (label) label.textContent = prev;
        }, 1200);
      } catch (err) {
        /* clipboard unavailable */
      }
    }

    let outputEditable = false;

    function toggleLock() {
      outputEditable = !outputEditable;
      preview.setAttribute("contenteditable", outputEditable ? "true" : "false");
      document.getElementById("previewShell").classList.toggle("editing", outputEditable);

      const label = document.querySelector(".lock-label");
      if (label) label.textContent = outputEditable ? "باز" : "قفل";

      if (outputEditable) preview.focus();
    }

    function clearAll() {
      input.value = "";
      render();
      // Fresh start: open the editor but stay out of editing mode, so the next
      // paste collapses it again.
      document.getElementById("inputShell").classList.remove("collapsed");
      editingInput = false;
      input.focus();
    }

    // Layout mode (header bar vs. two sidebars), persisted in localStorage.
    const LAYOUT_KEY = "pf:layout";
    const appEl = document.querySelector(".app");

    function setLayout(mode) {
      const sidebar = mode === "sidebar";
      appEl.classList.toggle("mode-sidebar", sidebar);
      appEl.classList.toggle("mode-header", !sidebar);

      const label = document.querySelector(".layout-label");
      if (label) label.textContent = sidebar ? "هدر" : "ساید‌بار";

      try {
        localStorage.setItem(LAYOUT_KEY, mode);
      } catch (err) {
        /* localStorage unavailable (private mode) — ignore */
      }
    }

    function toggleLayout() {
      setLayout(appEl.classList.contains("mode-sidebar") ? "header" : "sidebar");
    }

    (function initLayout() {
      let mode = "header";
      try {
        if (localStorage.getItem(LAYOUT_KEY) === "sidebar") mode = "sidebar";
      } catch (err) {
        /* ignore */
      }
      setLayout(mode);
    })();

    // Light / dark theme, persisted in localStorage. The highlight.js stylesheet
    // is swapped so code tokens stay legible in both themes.
    const THEME_KEY = "pf:theme";
    const HLJS_THEMES = {
      dark: "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css",
      light: "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-light.min.css"
    };

    function setTheme(theme) {
      const light = theme === "light";
      document.documentElement.setAttribute("data-theme", light ? "light" : "dark");

      const hljsLink = document.getElementById("hljsTheme");
      if (hljsLink) hljsLink.href = light ? HLJS_THEMES.light : HLJS_THEMES.dark;

      const label = document.querySelector(".theme-label");
      if (label) label.textContent = light ? "تیره" : "روشن";

      try {
        localStorage.setItem(THEME_KEY, light ? "light" : "dark");
      } catch (err) {
        /* localStorage unavailable — ignore */
      }
    }

    function toggleTheme() {
      const isLight = document.documentElement.getAttribute("data-theme") === "light";
      setTheme(isLight ? "dark" : "light");
    }

    (function initTheme() {
      let theme = "dark";
      try {
        if (localStorage.getItem(THEME_KEY) === "light") theme = "light";
      } catch (err) {
        /* ignore */
      }
      setTheme(theme);
    })();

    // --- Sharing: persist the current text on the server, get a short link ---

    async function shareCurrent() {
      const content = input.value.trim();
      if (!content) return;

      const btn = document.getElementById("shareBtn");
      btn.setAttribute("disabled", "true");
      try {
        const res = await fetch("/api/shares", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content })
        });
        if (!res.ok) throw new Error("share request failed");

        const data = await res.json();
        const url = `${location.origin}/s/${data.id}`;
        showShareToast(url);
        try {
          await navigator.clipboard.writeText(url);
        } catch (err) {
          /* clipboard blocked — the link is still shown for manual copy */
        }
      } catch (err) {
        showShareToast("خطا در ساخت لینک اشتراک. سرور در دسترس است؟", true);
      } finally {
        btn.removeAttribute("disabled");
      }
    }

    function showShareToast(text, isError) {
      const toast = document.getElementById("shareToast");
      const linkInput = document.getElementById("shareLink");
      linkInput.value = text;
      linkInput.style.display = isError ? "none" : "";
      document.querySelector(".share-copy").style.display = isError ? "none" : "";
      document.querySelector(".share-toast-label").textContent = isError ? "" : "لینک اشتراک";
      toast.hidden = false;
      if (!isError) {
        linkInput.focus();
        linkInput.select();
      }
    }

    function hideShareToast() {
      document.getElementById("shareToast").hidden = true;
    }

    async function copyShareLink() {
      const linkInput = document.getElementById("shareLink");
      linkInput.select();
      try {
        await navigator.clipboard.writeText(linkInput.value);
      } catch (err) {
        document.execCommand("copy");
      }
    }

    // On load: a /s/:id link loads the shared document (input full → collapsed).
    // Otherwise the editor starts empty with the cursor in the input — nothing
    // is restored or pasted automatically.
    (function initContent() {
      const match = location.pathname.match(/^\/s\/([A-Za-z0-9_-]+)$/);

      if (match) {
        fetch(`/api/shares/${match[1]}`)
          .then(res => (res.ok ? res.json() : Promise.reject(new Error("not found"))))
          .then(data => {
            input.value = data.content;
            render();
            collapseInput();
          })
          .catch(() => {
            preview.innerHTML = '<div class="empty">این لینک اشتراک پیدا نشد یا منقضی شده است.</div>';
          });
        return;
      }

      input.value = "";
      input.focus();
    })();
  </script>
</body>
